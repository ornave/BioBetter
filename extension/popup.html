<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BioBetter</title><link rel="stylesheet" href="popup.css"></head>
<body>
  <span class="eyebrow">A LITTLE SPACE TO THINK</span>
  <h1>Bio<span>Better</span></h1>
  <p>A calmer place to learn.</p>
  <label class="setting"><span>Enable BioBetter</span><input type="checkbox" id="enabled" role="switch"></label>
  <label class="setting" for="size"><span>Lesson text size</span><select id="size"><option value="16">16 px</option><option value="17">17 px</option><option value="18">18 px</option><option value="19">19 px</option><option value="20">20 px</option><option value="21">21 px</option><option value="22">22 px</option><option value="23">23 px</option><option value="24">24 px</option></select></label>
  <p class="detail">Applies to BioPlus notebooks, course pages, and study hubs. Your lessons, notes, images, and progress stay on the site. Switch off anytime to restore the original layout.</p>
  <p id="status" role="status"></p>
  <script src="popup.js"></script>
</body></html>
